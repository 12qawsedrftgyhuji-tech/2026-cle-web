<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키오스크 도우미</title>
<style>
  :root {
    --primary: #6750a4;
    --primary-dark: #4f3d85;
    --bg: #fdf7ff;
    --text: #1d1b20;
    --muted: #6b6573;
    --line: #1d1b20;
    --blue: #1a73e8;
    --red: #d93025;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- 로그인 화면 ---------- */
  #loginView {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
  }
  #loginView h1 { margin: 0; font-size: 28px; }
  #loginView p { margin: 0; color: var(--muted); max-width: 320px; line-height: 1.6; }
  .google-btn {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid #dadce0; background: #fff; color: #3c4043;
    font-size: 16px; font-weight: 500;
    box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }
  .google-btn:hover { background: #f8f9fa; }
  .google-btn svg { width: 20px; height: 20px; }
  #loginError { color: var(--red); font-size: 14px; min-height: 20px; }

  /* ---------- 앱 화면 ---------- */
  #appView { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-bottom: 1px solid #e6dff0; background: #fff;
    font-size: 14px;
  }
  .topbar .who { color: var(--muted); }
  .topbar button {
    border: 1px solid #cfc7dc; background: #fff; border-radius: 999px;
    padding: 6px 14px; font-size: 13px;
  }
  .main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 320px 1fr; gap: 14px; padding: 14px;
  }
  .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
  .right { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  .camera {
    width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden;
  }
  .camera video { width: 100%; height: 100%; object-fit: cover; }

  .mic-row { display: flex; align-items: center; gap: 14px; }
  .pill-btn {
    width: 72px; height: 72px; border-radius: 50%; border: none;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 500; line-height: 1.25;
  }
  .pill-btn:disabled { opacity: .55; }
  .mic-btn {
    width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid var(--line); background: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .mic-btn svg { width: 44px; height: 44px; }
  .mic-btn.on { background: #cfe2ff; border-color: var(--blue); }
  .mic-btn.off { background: #fbd0cc; border-color: var(--red); }
  #micStatus { text-align: center; font-size: 14px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: #cac4d0; border-radius: 999px; transition: .2s;
  }
  .switch span::before {
    content: ""; position: absolute; width: 20px; height: 20px; left: 4px; top: 4px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::before { transform: translateX(20px); }

  .speed-box { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .speed-top { display: flex; align-items: center; justify-content: space-between; }
  #speedNum {
    width: 70px; text-align: center; font-size: 15px;
    border: none; border-bottom: 1px solid var(--line); background: transparent; padding: 2px;
  }
  .speed-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  #speedRange { width: 100%; accent-color: var(--primary); }

  .clear-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--blue); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .clear-btn svg { width: 18px; height: 18px; }

  #answer {
    flex: 1; min-height: 160px; overflow-y: auto;
    border: 1.5px solid var(--line); border-radius: 16px; background: #fff;
    padding: 12px 14px; font-size: 16px; line-height: 1.65;
  }
  .placeholder { color: var(--muted); }
  .turn { margin-bottom: 14px; white-space: pre-wrap; word-break: keep-all; }
  .turn .q { font-weight: 700; }
  .turn .usage { font-size: 12px; color: var(--muted); }

  .suggest-label { font-size: 14px; }
  .suggest-row { display: flex; gap: 10px; }
  .suggest-row button {
    flex: 1; min-height: 38px; border: none; border-radius: 999px;
    background: var(--primary); color: #fff; font-size: 14px; padding: 6px 10px;
  }
  .suggest-row button:hover { background: var(--primary-dark); }

  .input-row { display: flex; gap: 8px; align-items: center; }
  #msg {
    flex: 1; height: 48px; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 0 14px; font-size: 16px; background: #fff; font-family: inherit;
  }
  .send-btn {
    width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn svg { width: 24px; height: 24px; }

  /* 나이 입력 대화상자 */
  dialog { border: none; border-radius: 16px; padding: 22px; max-width: 320px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { margin: 0 0 8px; }
  dialog input { width: 100%; padding: 10px; font-size: 16px; margin: 10px 0 14px; border: 1px solid #bbb; border-radius: 8px; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 8px; }
  dialog button { border: none; border-radius: 999px; padding: 8px 18px; font-size: 14px; }
  dialog .ok { background: var(--primary); color: #fff; }

  @media (max-width: 760px) {
    .main { grid-template-columns: 1fr; overflow-y: auto; }
    .left { overflow: visible; }
    #answer { min-height: 260px; }
    #appView { height: auto; min-height: 100%; }
  }
</style>
</head>
<body>

<!-- ================= 로그인 ================= -->
<div id="loginView">
  <h1>키오스크 도우미</h1>
  <p>카메라로 화면을 비추고 물어보세요.<br>AI가 쉬운 말로 알려드려요.</p>
  <button class="google-btn" id="btnGoogle">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Google로 로그인
  </button>
  <div id="loginError"></div>
</div>

<!-- ================= 앱 ================= -->
<div id="appView" class="hidden">
  <div class="topbar">
    <span class="who" id="whoami"></span>
    <button id="btnLogout">로그아웃</button>
  </div>

  <div class="main">
    <div class="left">
      <div class="camera"><video id="video" autoplay playsinline muted></video></div>

      <div class="mic-row">
        <button class="pill-btn" id="btnAiSuggest">질문<br>추천</button>
        <button class="mic-btn" id="btnMic" aria-label="마이크">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/>
          </svg>
        </button>
      </div>
      <div id="micStatus">마이크를 눌러 말씀하세요</div>

      <div class="row">
        <span>읽어주기</span>
        <label class="switch"><input type="checkbox" id="autoRead" checked><span></span></label>
      </div>

      <div class="speed-box">
        <div class="speed-top">
          <span>읽기 속도 조절</span>
          <input type="text" id="speedNum" inputmode="decimal" value="1.0">
        </div>
        <input type="range" id="speedRange" min="0" max="15" step="1" value="5">
        <div class="speed-scale"><span>0.5x</span><span>1.0x</span><span>2.0x</span></div>
      </div>

      <div class="row">
        <span>대화 기록 삭제</span>
        <button class="clear-btn" id="btnClear" aria-label="대화 기록 삭제">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div>
    </div>

    <div class="right">
      <div id="answer"></div>
      <div class="suggest-label">추천된 질문을 눌러보세요:</div>
      <div class="suggest-row">
        <button id="btnSuggest1"></button>
        <button id="btnSuggest2"></button>
      </div>
      <div class="input-row">
        <input id="msg" type="text" placeholder="Gemini에게 질문하기" enterkeyhint="send" autocomplete="off">
        <button class="send-btn" id="btnSend" aria-label="전송">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 나이 입력 -->
<dialog id="ageDialog">
  <h3>처음 오셨네요</h3>
  <div>나이에 맞는 말투로 답해 드리기 위해 나이를 알려 주세요.</div>
  <input type="number" id="ageInput" min="1" max="120" placeholder="예: 65">
  <div class="btns">
    <button id="ageSkip">건너뛰기</button>
    <button class="ok" id="ageOk">저장</button>
  </div>
</dialog>

<!-- OCR (한국어): ML Kit 대신 웹에서는 Tesseract.js를 사용합니다 -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script type="module">
/* =====================================================================
 *  1) Firebase 설정  ← 여기만 본인 값으로 바꾸세요
 *     (Firebase 콘솔 → 프로젝트 설정 → 내 앱 → 웹 앱)
 * ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDGAAOLcFgu1WYQ2MslImmgKnymVm6hUr0",
  authDomain: "tlqkfzz.firebaseapp.com",
  databaseURL: "https://tlqkfzz-default-rtdb.firebaseio.com",
  projectId: "tlqkfzz",
  storageBucket: "tlqkfzz.firebasestorage.app",
  messagingSenderId: "84615874589",
  appId: "1:84615874589:web:f7c35afc86988892145ef4"
};
const FIRESTORE_DB_ID = "engineersfirestore";   // 앱에서 쓰던 Firestore 데이터베이스 이름
const CHAT_MODEL    = "gemini-3.1-flash-lite";  // 앱 코드와 동일
const SUGGEST_MODEL = "gemini-3.5-flash-lite";  // 앱 코드와 동일
const DAILY_TOKEN_LIMIT = 100000;

/* ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDoc, setDoc, getDocs, query, orderBy, limit,
         serverTimestamp, increment, writeBatch }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { getDatabase, ref as dbRef, get as dbGet, set as dbSet, update as dbUpdate }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
// API 키를 브라우저에 노출하지 않으려고 Firebase AI Logic을 통해 Gemini를 호출합니다.
import { getAI, getGenerativeModel, GoogleAIBackend }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fs = getFirestore(app, FIRESTORE_DB_ID);
const rtdb = getDatabase(app);
const ai = getAI(app, { backend: new GoogleAIBackend() });

const $ = (id) => document.getElementById(id);

/* ===================== 상태 ===================== */
let currentUser = null;
let username = "사용자";
let userage = -1;
let cachedUsage = null;
let latestOcrText = "";
let isSending = false;
let isSuggesting = false;

let chatModel = null, chat = null, suggestModel = null;
let chatLog = [];                 // {q, a, percent}

/* ===================== 로그인 ===================== */
$("btnGoogle").onclick = async () => {
  $("loginError").textContent = "";
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      $("loginError").textContent = "로그인에 실패했어요: " + (e.message || e.code);
    }
  }
};

$("btnLogout").onclick = async () => {
  stopCamera();
  window.speechSynthesis.cancel();
  await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (!user) {
    $("appView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    return;
  }
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  username = user.displayName || "사용자";
  $("whoami").textContent = `${username}님`;
  await startApp();
});

/* ===================== 앱 시작 ===================== */
async function startApp() {
  applySuggestions(SuggestionEngine.suggest(""));
  shownSuggestions = SuggestionEngine.suggest("");
  initSuggestModel();
  startCamera();
  await loadAge();
  await initGemini();
}

async function loadAge() {
  userage = -1;
  try {
    const accRef = dbRef(rtdb, `UserAccount/${currentUser.uid}`);
    const snap = await dbGet(accRef);
    if (snap.exists()) {
      const n = parseInt(snap.val().age, 10);
      userage = Number.isFinite(n) ? n : -1;
    } else {
      // 처음 로그인: 계정 정보 만들기 (앱의 login.kt와 같은 구조)
      await dbSet(accRef, {
        idToken: currentUser.uid,
        emailId: currentUser.email,
        name: currentUser.displayName
      });
    }
    if (userage < 0) userage = await askAge(accRef);
  } catch (e) {
    console.error("사용자 정보 불러오기 실패", e);
  }
}

function askAge(accRef) {
  return new Promise((resolve) => {
    const dlg = $("ageDialog");
    const done = async (save) => {
      const n = parseInt($("ageInput").value, 10);
      dlg.close();
      if (save && n > 0) {
        try { await dbUpdate(accRef, { age: n }); } catch (e) { console.error(e); }
        resolve(n);
      } else resolve(-1);
    };
    $("ageOk").onclick = () => done(true);
    $("ageSkip").onclick = () => done(false);
    dlg.showModal();
  });
}

/* ===================== Firestore 저장소 ===================== */
const chatsCol = () => collection(fs, "users", currentUser.uid, "chats");

function todayKey() {
  // Asia/Seoul 기준 yyyy-MM-dd
  return new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Seoul" }).format(new Date());
}
const usageDoc = () => doc(fs, "users", currentUser.uid, "usage", todayKey());

async function saveChat(question, answer, ocr) {
  try {
    await addDoc(chatsCol(), { question, answer, ocr: ocr.slice(0, 3000), time: serverTimestamp() });
  } catch (e) { console.error("저장 실패", e); }
}

async function loadRecent(n) {
  try {
    const snap = await getDocs(query(chatsCol(), orderBy("time", "desc"), limit(n)));
    return snap.docs
      .map((d) => ({ q: d.data().question, a: d.data().answer }))
      .filter((t) => t.q != null && t.a != null)
      .reverse();
  } catch (e) {
    console.error("불러오기 실패", e);
    return [];
  }
}

async function getTodayUsage() {
  try {
    const s = await getDoc(usageDoc());
    return s.exists() ? (s.data().tokens ?? 0) : 0;
  } catch (e) {
    console.error("사용량 확인 실패", e);
    return null;
  }
}

async function addUsage(tokens) {
  if (tokens <= 0) return;
  try {
    await setDoc(usageDoc(), { tokens: increment(tokens), updated: serverTimestamp() }, { merge: true });
  } catch (e) { console.error("사용량 기록 실패", e); }
}

async function clearAllChats() {
  try {
    const snap = await getDocs(query(chatsCol(), limit(500)));
    const batch = writeBatch(fs);
    snap.docs.forEach((d) => batch.delete(d.ref));
    await batch.commit();
  } catch (e) { console.error(e); }
}

/* ===================== Gemini ===================== */
function initSuggestModel() {
  if (suggestModel) return;
  suggestModel = getGenerativeModel(ai, {
    model: SUGGEST_MODEL,
    generationConfig: { maxOutputTokens: 1024, temperature: 0.4 },
    systemInstruction: `당신은 디지털 기기(키오스크 등) 사용이 어려운 사용자를 돕는 도우미입니다.
화면 OCR 텍스트를 보고 사용자가 지금 물어볼 만한 질문 2개를 추천하세요.
- 정확히 2줄, 각 줄은 "주제|질문" 형식입니다.
- 주제는 5~8자, 질문은 25자 이내의 쉬운 말로 쓰세요.
- 화면에 실제로 보이는 단어(버튼 이름 등)를 활용하세요.
- 다른 설명, 번호, 마크다운은 쓰지 마세요.
예:
결제 방법|결제는 어떻게 해요?
포장 선택|포장하려면 뭘 눌러야 해요?`
  });
}

async function initGemini() {
  cachedUsage = await getTodayUsage();
  const turns = await loadRecent(20);

  const nameText = username ? `사용자의 이름은 ${username}입니다.` : "";
  const ageText = userage > 0 ? `사용자의 나이는 ${userage}세입니다. 나이에 맞게 존대 등을 조절하세요.` : "";

  chatModel = getGenerativeModel(ai, {
    model: CHAT_MODEL,
    systemInstruction: `당신은 디지털 기기(ex:키오스크) 사용이 어려운 사용자를 돕는 친절한 도우미입니다.
${nameText}
${ageText}
사용자가 질문할 때마다 카메라로 촬영한 디지털 기기의 화면의 OCR 텍스트가 함께 전달됩니다.
OCR 오타가 있을 수 있으니 문맥으로 보정하세요.
현재 화면을 기준으로, 디지털 소외 계층 분들도 이해할 수 있게 쉬운 말로 단계별로 짧게 답하세요.
OCR텍스트는 높임말로 변환하지말고 있는 그대로 전달해주세요.(예를 들어 주문하기 버튼을 주문하세요 버튼으로 치환 금지)
이전 대화 내용을 참고해 후속 질문에도 자연스럽게 답하세요.`
  });
  chat = chatModel.startChat({
    history: turns.flatMap((t) => [
      { role: "user", parts: [{ text: t.q }] },
      { role: "model", parts: [{ text: t.a }] }
    ])
  });

  chatLog = turns.map((t) => ({ q: t.q, a: t.a, percent: null }));
  renderLog();
}

function isRetryable(e) {
  const msg = String(e?.message || e);
  return /503|UNAVAILABLE|high demand|overloaded|network|timeout/i.test(msg);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function withRetry(block, times = 3, delay = 500) {
  for (let i = 0; i < times - 1; i++) {
    try { return await block(); }
    catch (e) { if (!isRetryable(e)) throw e; await sleep(delay); delay *= 2; }
  }
  return block();
}

/* ===================== 화면 표시 ===================== */
function renderLog(pending = "") {
  const box = $("answer");
  box.innerHTML = "";
  if (!chatLog.length && !pending) {
    const p = document.createElement("div");
    p.className = "placeholder";
    p.textContent = "Gemini 답변이 여기에 표시됩니다.";
    box.appendChild(p);
    return;
  }
  chatLog.forEach((t) => {
    const d = document.createElement("div");
    d.className = "turn";
    const q = document.createElement("div"); q.className = "q"; q.textContent = "질문: " + t.q;
    const a = document.createElement("div"); a.textContent = "답변: " + t.a;
    d.append(q, a);
    if (t.percent != null) {
      const u = document.createElement("div"); u.className = "usage"; u.textContent = `오늘 사용량 ${t.percent}%`;
      d.appendChild(u);
    }
    box.appendChild(d);
  });
  if (pending) {
    const p = document.createElement("div");
    p.className = "turn";
    p.textContent = pending;
    box.appendChild(p);
  }
  box.scrollTop = box.scrollHeight;
}

/* ===================== 질문 전송 ===================== */
async function sendToGemini(question) {
  if (!chat) { toast("AI를 준비하는 중이에요. 잠시 후 다시 시도해 주세요."); return; }
  const q = question.trim();
  if (!q || isSending) return;

  if (cachedUsage == null) { renderLog("사용량을 확인하는 중이에요. 잠시 후 다시 시도해 주세요."); return; }
  if (cachedUsage >= DAILY_TOKEN_LIMIT) {
    const msg = "오늘 사용할 수 있는 AI 사용량을 모두 사용했어요. 내일 다시 이용해 주세요.";
    renderLog(msg);
    if ($("autoRead").checked) speak(msg);
    return;
  }

  isSending = true;
  window.speechSynthesis.cancel();
  const ocr = latestOcrText;
  renderLog(`질문: ${q}\n답변을 만드는 중...`);

  const prompt = `[현재 화면 OCR 텍스트]
${ocr.trim() || "(인식된 텍스트 없음)"}

[사용자 질문]
${q}`;

  try {
    const result = await withRetry(() => chat.sendMessage(prompt));
    const answer = (result.response.text() || "").trim() || "답변을 받지 못했어요.";
    const tokens = result.response.usageMetadata?.totalTokenCount ?? 0;

    cachedUsage += tokens;
    const percent = Math.min(100, Math.floor((cachedUsage * 100) / DAILY_TOKEN_LIMIT));
    chatLog.push({ q, a: answer, percent });
    renderLog();
    if ($("autoRead").checked) speak(answer);
    saveChat(q, answer, ocr);
    addUsage(tokens);
  } catch (e) {
    console.error("요청 실패", e);
    const busy = /503|high demand/i.test(String(e?.message));
    renderLog(`질문: ${q}\n` + (busy ? "지금 AI가 많이 바빠요. 잠시 후 다시 시도해 주세요." : "오류가 발생했어요. 잠시 후 다시 시도해 주세요."));
  } finally {
    isSending = false;
  }
}

function onSendClicked() {
  const text = $("msg").value;
  if (!text.trim()) return;
  sendToGemini(text);
  $("msg").value = "";
  $("msg").blur();
}
$("btnSend").onclick = onSendClicked;
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); onSendClicked(); }
});

/* 대화 기록 삭제 */
async function confirmClearHistory() {
  if (!confirm("저장된 대화 기록을 모두 삭제할까요?")) return;
  await clearAllChats();
  chatLog = [];
  chat = chatModel.startChat();
  renderLog();
}
$("btnClear").onclick = confirmClearHistory;
// 전송 버튼을 길게 눌러도 삭제 (앱과 동일)
let pressTimer;
$("btnSend").addEventListener("pointerdown", () => { pressTimer = setTimeout(() => { pressTimer = null; confirmClearHistory(); }, 700); });
["pointerup", "pointerleave"].forEach((ev) => $("btnSend").addEventListener(ev, () => clearTimeout(pressTimer)));

/* ===================== 규칙 기반 추천 질문 (토큰 0) ===================== */
const SuggestionEngine = (() => {
  const rules = [
    { keyword: "결제",   label: "결제 방법",     question: "결제는 어떻게 해요?", priority: 5 },
    { keyword: "카드",   label: "카드 넣는 곳",  question: "카드는 어디에 넣어야 해요?", priority: 4 },
    { keyword: "번호표", label: "번호표 받기",   question: "번호표는 어떻게 받아요?", priority: 4 },
    { keyword: "포장",   label: "포장/매장 선택", question: "포장이랑 매장 식사 중에 뭘 눌러야 해요?", priority: 3 },
    { keyword: "매장",   label: "포장/매장 선택", question: "포장이랑 매장 식사 중에 뭘 눌러야 해요?", priority: 3 },
    { keyword: "주문",   label: "주문 시작",     question: "주문은 어떻게 시작해요?", priority: 2 },
    { keyword: "터치",   label: "누를 곳",       question: "어디를 눌러야 해요?", priority: 1 }
  ];
  const defaults = [
    { label: "지금 할 일", question: "지금 화면에서 뭘 해야 해요?" },
    { label: "화면 설명",  question: "이 화면은 무슨 화면이에요?" }
  ];
  return {
    suggest(ocrText) {
      const compact = ocrText.replace(/\s/g, "");
      const matched = rules
        .filter((r) => compact.includes(r.keyword))
        .sort((a, b) => b.priority - a.priority)
        .map((r) => ({ label: r.label, question: r.question }));
      const seen = new Set();
      return [...matched, ...defaults]
        .filter((s) => { const k = s.label + "|" + s.question; if (seen.has(k)) return false; seen.add(k); return true; })
        .slice(0, 2);
    }
  };
})();

let shownSuggestions = [];
let candidateSuggestions = null;
let candidateCount = 0;
let aiHoldUntil = 0;

const sameList = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function applySuggestions(list) {
  [[$("btnSuggest1"), list[0]], [$("btnSuggest2"), list[1]]].forEach(([btn, s]) => {
    btn.textContent = s ? s.label : "";
    btn.dataset.q = s ? s.question : "";
    btn.classList.toggle("hidden", !s);
  });
}
$("btnSuggest1").onclick = (e) => e.currentTarget.dataset.q && sendToGemini(e.currentTarget.dataset.q);
$("btnSuggest2").onclick = (e) => e.currentTarget.dataset.q && sendToGemini(e.currentTarget.dataset.q);

function updateSuggestions(ocrText) {
  if (performance.now() < aiHoldUntil) return;
  if (!ocrText.trim()) return;
  const next = SuggestionEngine.suggest(ocrText);
  if (sameList(next, shownSuggestions)) { candidateSuggestions = null; candidateCount = 0; return; }
  if (candidateSuggestions && sameList(next, candidateSuggestions)) candidateCount++;
  else { candidateSuggestions = next; candidateCount = 1; }
  if (candidateCount >= 3) { shownSuggestions = next; applySuggestions(next); }
}

/* AI 추천 (버튼을 눌렀을 때만 1회 호출) */
async function requestAiSuggestions() {
  if (!suggestModel) { toast("질문을 준비하는 중이에요. 잠시 후 다시 시도해 주세요."); return; }
  if (isSuggesting || isSending) return;
  const ocr = latestOcrText;
  if (!ocr.trim()) { toast("화면의 글자가 아직 인식되지 않았어요. 화면을 비춰 주세요."); return; }
  if (cachedUsage == null) { toast("사용량을 확인하는 중이에요. 잠시 후 다시 시도해 주세요."); return; }
  if (cachedUsage >= DAILY_TOKEN_LIMIT) { toast("오늘 AI 사용량을 모두 사용했어요."); return; }

  isSuggesting = true;
  $("btnAiSuggest").disabled = true;
  $("btnAiSuggest").innerHTML = "생성<br>중...";

  try {
    const result = await Promise.race([
      withRetry(() => suggestModel.generateContent("[화면 OCR 텍스트]\n" + ocr.slice(0, 600))),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 15000))
    ]);
    const list = (result.response.text() || "")
      .split("\n")
      .map((l) => l.trim().replace(/^[-* ]+/, ""))
      .filter((l) => l.includes("|"))
      .map((l) => { const i = l.indexOf("|"); return { label: l.slice(0, i).trim().slice(0, 8), question: l.slice(i + 1).trim() }; })
      .filter((s) => s.label && s.question)
      .slice(0, 2);

    if (!list.length) toast("추천을 만들지 못했어요. 다시 시도해 주세요.");
    else {
      shownSuggestions = list;
      candidateSuggestions = null; candidateCount = 0;
      applySuggestions(list);
      aiHoldUntil = performance.now() + 30000;
    }
    const tokens = result.response.usageMetadata?.totalTokenCount ?? 0;
    cachedUsage += tokens;      // 결과가 비어도 토큰은 소모되므로 항상 기록
    addUsage(tokens);
  } catch (e) {
    console.error("추천 요청 실패", e);
    toast("추천 중 오류가 발생했어요.");
  } finally {
    isSuggesting = false;
    $("btnAiSuggest").disabled = false;
    $("btnAiSuggest").innerHTML = "질문<br>추천";
  }
}
$("btnAiSuggest").onclick = requestAiSuggestions;

/* ===================== 카메라 + OCR ===================== */
const KIOSK_KEYWORDS = { "결제": 2, "주문": 2, "카드": 1, "포장": 1, "매장": 1, "번호표": 2, "터치": 1 };
const KIOSK_THRESHOLD = 3;

let stream = null, ocrWorker = null, ocrRunning = false, hitCount = 0, confirmed = false;
const canvas = document.createElement("canvas");

async function startCamera() {
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    $("video").srcObject = stream;
  } catch (e) {
    console.error(e);
    toast("카메라 권한이 필요합니다");
    return;
  }
  try {
    ocrWorker = await Tesseract.createWorker("kor");
  } catch (e) {
    console.error("OCR 준비 실패", e);
    toast("글자 인식을 준비하지 못했어요.");
    return;
  }
  ocrRunning = true;
  ocrLoop();
}

function stopCamera() {
  ocrRunning = false;
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  if (ocrWorker) { ocrWorker.terminate(); ocrWorker = null; }
  $("video").srcObject = null;
}

async function ocrLoop() {
  while (ocrRunning) {
    const v = $("video");
    if (!document.hidden && v.videoWidth > 0) {
      const scale = Math.min(1, 1000 / v.videoWidth);
      canvas.width = v.videoWidth * scale;
      canvas.height = v.videoHeight * scale;
      canvas.getContext("2d").drawImage(v, 0, 0, canvas.width, canvas.height);
      try {
        const { data } = await ocrWorker.recognize(canvas);
        handleOcr(data.text || "");
      } catch (e) { console.error("OCR 실패", e); }
    }
    await sleep(300);
  }
}

function handleOcr(text) {
  latestOcrText = text;
  updateSuggestions(text);

  // 공백 제거 후 비교 (OCR 띄어쓰기 오류 대비)
  const compact = text.replace(/\s/g, "");
  const matched = Object.keys(KIOSK_KEYWORDS).filter((k) => compact.includes(k));
  const score = matched.reduce((s, k) => s + KIOSK_KEYWORDS[k], 0);
  const isKiosk = score >= KIOSK_THRESHOLD;
  hitCount = isKiosk ? hitCount + 1 : 0;
  confirmed = hitCount >= 3;     // 필요하면 화면에 "키오스크 감지됨" 표시용으로 사용
}

/* ===================== 음성 출력(TTS) ===================== */
let ttsSpeed = 1.0;

function speak(text) {
  const clean = text.replace(/\*\*|\*|#|`/g, "").trim();   // 마크다운 기호 제거
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "ko-KR";
  u.rate = ttsSpeed;
  const ko = window.speechSynthesis.getVoices().find((v) => v.lang.startsWith("ko"));
  if (ko) u.voice = ko;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}
$("autoRead").onchange = (e) => { if (!e.target.checked) window.speechSynthesis.cancel(); };

/* 읽기 속도: 슬라이더(0~15 → 0.5~2.0x) <-> 입력칸 */
const speedToProgress = (s) => Math.round(s * 10) - 5;
const progressToSpeed = (p) => (p + 5) / 10;
function applySpeed(speed, { updateText = true, updateRange = true } = {}) {
  const c = Math.min(2.0, Math.max(0.5, speed));
  ttsSpeed = c;
  if (updateRange) $("speedRange").value = speedToProgress(c);
  if (updateText) $("speedNum").value = c.toFixed(1);
}
$("speedRange").oninput = (e) => applySpeed(progressToSpeed(+e.target.value), { updateRange: false });
$("speedNum").addEventListener("input", (e) => {
  const v = parseFloat(e.target.value);
  if (Number.isNaN(v)) return;
  if (v > 2.0) applySpeed(2.0);
  else if (v >= 0.5) applySpeed(v, { updateText: false });
});
const finishSpeedInput = () => applySpeed(parseFloat($("speedNum").value) || 1.0);
$("speedNum").addEventListener("blur", finishSpeedInput);
$("speedNum").addEventListener("keydown", (e) => { if (e.key === "Enter") { finishSpeedInput(); e.target.blur(); } });
applySpeed(1.0);

/* ===================== 음성 인식(STT) ===================== */
// 마이크 버튼: 첫 터치 = 녹음 시작, 두 번째 터치 = 녹음 종료 → 자동 전송
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, isListening = false, finalText = "", interimText = "", micRed = false, micTimer = null;

function setMic(state) {   // "idle" | "on" | "off"
  clearTimeout(micTimer);
  $("btnMic").classList.toggle("on", state === "on");
  $("btnMic").classList.toggle("off", state === "off");
  micRed = state === "off";
  if (state === "off") micTimer = setTimeout(() => setMic("idle"), 2000);   // 빨강 2초 뒤 기본색
}

function startListening() {
  if (!SR) { toast("이 브라우저에서는 음성 인식을 사용할 수 없습니다. (Chrome 권장)"); return; }
  window.speechSynthesis.cancel();
  recognizer = new SR();
  recognizer.lang = "ko-KR";
  recognizer.interimResults = true;
  recognizer.continuous = true;
  finalText = ""; interimText = "";

  recognizer.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    interimText = interim;
    $("msg").value = (finalText + interim).trim();   // 말하는 내용을 입력창에 실시간 표시
  };
  recognizer.onerror = (ev) => {
    console.warn("STT 오류", ev.error);
    if (ev.error === "not-allowed") toast("마이크 권한이 필요합니다");
    else if (ev.error !== "no-speech" && ev.error !== "aborted") toast(`음성 인식 실패(${ev.error}). 다시 시도해 주세요`);
  };
  recognizer.onend = () => {
    const text = (finalText + interimText).trim();
    isListening = false;
    recognizer = null;
    if (!micRed) setMic("off");
    $("micStatus").textContent = "마이크를 눌러 말씀하세요";
    if (text) { sendToGemini(text); $("msg").value = ""; }
    else if (micRed) toast("음성이 인식되지 않았어요. 다시 말씀해 주세요");
  };

  try {
    recognizer.start();
    isListening = true;
    setMic("on");
    $("micStatus").textContent = "듣는 중... 다 말씀하셨으면 다시 눌러주세요";
  } catch (e) { console.error(e); }
}

$("btnMic").onclick = () => {
  if (isListening) {
    $("micStatus").textContent = "변환 중...";
    setMic("off");
    recognizer?.stop();     // 결과는 onend에서 처리
  } else startListening();
};

/* ===================== 기타 ===================== */
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;max-width:90%;text-align:center;transition:opacity .2s";
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.opacity = "0"), 2500);
}

window.speechSynthesis.getVoices();   // 일부 브라우저에서 음성 목록 미리 로드
renderLog();
</script>
